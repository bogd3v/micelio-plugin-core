name: Bug
description: Something does not work as documented.
title: 'fix: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Write in English if you can. A security problem does not go here: report it privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest path from a fresh instance. Use neutral data, never real addresses or tokens.
      placeholder: |
        1. Start the demo instance with …
        2. Open …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (`v0.1.0`), the image tag or the commit you run.
      placeholder: 'micelio-plugin-core v0.1.0'
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Who is affected
      options:
        - Site visitor
        - Site editor (CMS)
        - Site operator (install, configure, upgrade)
        - Theme creator
        - Contributor
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Site mode (dynamic, static, landing), theme, browser and system, or Node and database for the server. Only what applies.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, email addresses and IP addresses before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the open issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
