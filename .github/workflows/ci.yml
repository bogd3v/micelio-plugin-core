name: CI

# The required checks of section 15 of the engineering standard, called from the reusable workflows of
# micelio-engineering (docs/workflows.md there). The workflows are pinned by commit SHA.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
    uses: bogd3v/micelio-engineering/.github/workflows/check.yml@0ce60010c72b13625ec223db96901e6b498c3409 # main
    with:
      licenses: true
      standard: true
      reuse: true

  # The admin pages in Chromium, with an axe run (WCAG 2.2 A and AA): not a check of section 15
  # that the reusable workflow runs, so it is a job of its own (`npm run test:admin`, AGENTS.md).
  admin:
    name: Admin pages
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test the admin pages
        run: npm run test:admin

  # The stack of compose.dev.yml (`npm run dev:docker`): it must build, boot, seed and answer on both
  # services. The CMS has `/_health`; the frontend has none, so it is asked for `/`, as its image's own
  # health check does.
  compose:
    name: Compose stack
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Bring the stack up
        run: npm run dev:docker

      - name: Check the CMS
        run: curl --fail --silent --show-error --output /dev/null --write-out 'cms /_health %{http_code}\n' http://localhost:1337/_health

      - name: Check the frontend
        run: curl --fail --silent --show-error --output /dev/null --write-out 'frontend / %{http_code}\n' http://localhost:3000/

      - name: Show the logs
        if: ${{ failure() }}
        run: docker compose -f compose.dev.yml logs --no-color

      - name: Bring the stack down
        if: ${{ always() }}
        run: npm run dev:docker -- down

  dco:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: bogd3v/micelio-engineering/.github/workflows/dco.yml@0ce60010c72b13625ec223db96901e6b498c3409 # main

  scorecard:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: bogd3v/micelio-engineering/.github/workflows/scorecard.yml@0ce60010c72b13625ec223db96901e6b498c3409 # main
