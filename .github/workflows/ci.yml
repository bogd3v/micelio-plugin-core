name: CI

# The required checks of section 15 of the engineering standard, called from the reusable workflows of
# micelio-engineering (docs/workflows.md there). The workflows are pinned by commit SHA.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
    uses: bogd3v/micelio-engineering/.github/workflows/check.yml@3693c82f3ed517705c4db27180662d28458f0458 # main
    with:
      licenses: true
      standard: true
      reuse: true

  # The admin pages in Chromium, with an axe run (WCAG 2.2 A and AA): not a check of section 15
  # that the reusable workflow runs, so it is a job of its own (`npm run test:admin`, AGENTS.md).
  admin:
    name: Admin pages
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test the admin pages
        run: npm run test:admin

  dco:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: bogd3v/micelio-engineering/.github/workflows/dco.yml@3693c82f3ed517705c4db27180662d28458f0458 # main

  scorecard:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: bogd3v/micelio-engineering/.github/workflows/scorecard.yml@3693c82f3ed517705c4db27180662d28458f0458 # main
