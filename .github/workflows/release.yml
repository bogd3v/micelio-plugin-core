name: Release

# Only the maintainer runs it (section 7 of the engineering standard). It defaults to a dry run: it
# prints the version and the notes it would publish and changes nothing. Publishing needs a
# `release` environment with required reviewers (README).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the version and the notes without tagging or publishing
        type: boolean
        default: true
      release_candidate:
        description: Release a candidate (vX.Y.Z-rc.N) that moves neither X.Y nor latest
        type: boolean
        default: false
      compatibility:
        description: Markdown bullets for Compatibility (the core line it supports, the minimum Node); required to publish
        type: string
        default: ''
      breaking_changes:
        description: Hand-written Breaking changes section; required when a pull request is breaking
        type: string
        default: ''
      upgrade_notes:
        description: Upgrade notes for the release body (required when a pull request is breaking)
        type: string
        default: ''

permissions: {}

jobs:
  release:
    # A called workflow cannot ask for more than its caller grants, also in a job that is skipped.
    permissions:
      contents: write
      packages: write
      pull-requests: read
      actions: read
      id-token: write
    uses: bogd3v/micelio-engineering/.github/workflows/release.yml@0ce60010c72b13625ec223db96901e6b498c3409 # main
    with:
      dry-run: ${{ inputs.dry_run }}
      release-candidate: ${{ inputs.release_candidate }}
      compatibility: ${{ inputs.compatibility }}
      breaking-changes: ${{ inputs.breaking_changes }}
      upgrade-notes: ${{ inputs.upgrade_notes }}
      # The package is at the root of this repository, not a workspace.
      npm-root: true
    secrets: inherit
