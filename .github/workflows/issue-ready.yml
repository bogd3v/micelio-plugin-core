name: Issue ready

# Gate 1 of the factory (docs/factory.md of micelio-engineering): lint-issue on every issue
# opened or edited by the people who work on the repository, then the label `ready`.
on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  issue-ready:
    permissions:
      contents: read
      issues: read
    uses: bogd3v/micelio-engineering/.github/workflows/issue-ready.yml@2d3087d5ee4f3f6cb078ed69a7d91e128e2d289f # main
    with:
      tools-ref: 0ce60010c72b13625ec223db96901e6b498c3409
    secrets:
      MICELIO_BOT_PRIVATE_KEY: ${{ secrets.MICELIO_BOT_PRIVATE_KEY }}
