version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      lint-and-types:
        patterns:
          - eslint
          - 'eslint-*'
          - '@eslint/*'
          - typescript-eslint
          - '@micelio/*'
          - '@types/*'
        update-types:
          - minor
          - patch
      other:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
